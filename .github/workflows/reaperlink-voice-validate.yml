name: ReaperLink Voice Validate

on:
  push:
    branches:
      - reaperlink-voice-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reaperlink-voice-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.slot }} - ${{ matrix.task }}
    runs-on: [self-hosted, Windows, X64, org-shared]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - slot: Terminator
            task: js-syntax
          - slot: Predator
            task: manifest
          - slot: Johnny-5
            task: signaling-routes
          - slot: Rambo
            task: session-security
          - slot: Snake-Eyes
            task: browser-voice
          - slot: Dave
            task: ice-config
          - slot: Jeff
            task: physical-regression
          - slot: Steve
            task: call-sync
          - slot: Mike
            task: https-gate
          - slot: Gary
            task: package-smoke

    steps:
      - uses: actions/checkout@v4

      - name: Install Node for JS syntax checks
        if: matrix.task == 'js-syntax'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate ReaperLink Voice
        shell: powershell
        run: |
          .\.github\scripts\reaperlink-voice-validate.ps1 -Task "${{ matrix.task }}" -Slot "${{ matrix.slot }}"

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: reaperlink-voice-validate-${{ matrix.task }}-${{ runner.name }}
          path: .voice-validation\${{ matrix.task }}.txt
          if-no-files-found: error


  qa:
    name: ${{ matrix.persona }} - ${{ matrix.task }}
    runs-on: [self-hosted, Windows, X64, testing, qa]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - persona: CHER
            task: source-gate
          - persona: JANET
            task: safety-gate
          - persona: MADONNA
            task: payload-gate
          - persona: TINA
            task: compile-gate
          - persona: BLONDIE
            task: distribution-gate

    steps:
      - uses: actions/checkout@v4

      - name: Run ReaperLink installer QA
        shell: powershell
        run: |
          .\.github\scripts\reaperlink-installer-qa.ps1 -Task "${{ matrix.task }}" -Persona "${{ matrix.persona }}"

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: reaperlink-installer-qa-${{ matrix.task }}-${{ runner.name }}
          path: .installer-qa\${{ matrix.task }}.txt
          if-no-files-found: error


  package:
    name: Build ReaperLink Setup EXE
    runs-on: [self-hosted, Windows, X64, org-shared]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate installer engine syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\installer\ReaperLink-InstallCore.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "ReaperLink install engine syntax validation failed."
          }
          Write-Host "Install engine syntax OK"

      - name: Ensure Inno Setup compiler
        id: inno
        shell: powershell
        run: |
          function Find-Iscc {
            $candidates = @(
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Inno Setup 6\ISCC.exe"
            )

            foreach ($regPath in @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
            )) {
              try {
                $loc = (Get-ItemProperty -LiteralPath $regPath -ErrorAction Stop).InstallLocation
                if ($loc) { $candidates += (Join-Path $loc 'ISCC.exe') }
              } catch {}
            }

            return ($candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1)
          }

          $iscc = Find-Iscc

          if (-not $iscc) {
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($winget) {
              & $winget.Source install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements --silent
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "winget returned $LASTEXITCODE while installing Inno Setup."
              }
              Start-Sleep -Seconds 2
              $iscc = Find-Iscc
            }
          }

          if (-not $iscc) {
            $choco = Get-Command choco -ErrorAction SilentlyContinue
            if ($choco) {
              & $choco.Source install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Chocolatey returned $LASTEXITCODE while installing Inno Setup."
              }
              Start-Sleep -Seconds 2
              $iscc = Find-Iscc
            }
          }

          if (-not $iscc) {
            $roots = @($env:ProgramFiles, $env:LOCALAPPDATA)
            $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
            if ($pf86) { $roots += $pf86 }
            foreach ($root in $roots) {
              if ($root -and (Test-Path -LiteralPath $root)) {
                $hit = Get-ChildItem -LiteralPath $root -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'Inno Setup' } |
                  Select-Object -First 1
                if ($hit) { $iscc = $hit.FullName; break }
              }
            }
          }

          if (-not $iscc) {
            throw "Inno Setup 6 compiler (ISCC.exe) is not available on this runner after installation."
          }

          "iscc=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "ISCC: $iscc"

      - name: Compile proper Windows setup wizard
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ".\dist" | Out-Null
          & "${{ steps.inno.outputs.iscc }}" ".\installer\ReaperLink-Setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler failed with exit code $LASTEXITCODE"
          }

      - name: Verify setup executable
        shell: powershell
        run: |
          $exe = ".\dist\ReaperLink-Voice-Tester-Setup.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "ReaperLink setup EXE was not produced."
          }
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -lt 1000000) {
            throw "Setup EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Setup EXE OK: $size bytes"

      - name: Upload ReaperLink setup wizard
        uses: actions/upload-artifact@v4
        with:
          name: ReaperLink-Voice-Tester-Setup
          path: dist/ReaperLink-Voice-Tester-Setup.exe
          if-no-files-found: error
          retention-days: 14
