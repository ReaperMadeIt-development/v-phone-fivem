name: ReaperLink Setup Hot Build

on:
  push:
    branches:
      - reaperlink-voice-dev
    paths:
      - '.github/workflows/reaperlink-setup-hotbuild.yml'
      - '.github/scripts/reaperlink-setup-build.ps1'
      - 'installer/**'
      - 'apps/**'
      - 'bridge/**'
      - 'client/**'
      - 'compat/**'
      - 'docs/**'
      - 'html/**'
      - 'locales/**'
      - 'server/**'
      - 'sounds/**'
      - 'fxmanifest.lua'
      - 'config.lua'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_primary:
    name: Setup EXE attempt 1 - package pool
    runs-on: [self-hosted, Windows, X64, worker, integration, package]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        shell: powershell
        run: |
          .\.github\scripts\reaperlink-setup-build.ps1 -Attempt "1-package"
      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ReaperLink-Voice-Tester-Setup
          path: dist/ReaperLink-Voice-Tester-Setup.exe
          if-no-files-found: error
          retention-days: 14

  build_retry_qa:
    name: Setup EXE attempt 2 - QA pool
    needs: build_primary
    if: ${{ always() }} && needs.build_primary.result == 'failure'
    runs-on: [self-hosted, Windows, X64, worker, testing, qa]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retry installer build through QA pool
        shell: powershell
        run: |
          .\.github\scripts\reaperlink-setup-build.ps1 -Attempt "2-qa"
      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ReaperLink-Voice-Tester-Setup
          path: dist/ReaperLink-Voice-Tester-Setup.exe
          if-no-files-found: error
          retention-days: 14

  build_retry_build:
    name: Setup EXE attempt 3 - build pool
    needs: [build_primary, build_retry_qa]
    if: ${{ always() }} && needs.build_retry_qa.result == 'failure'
    runs-on: [self-hosted, Windows, X64, worker, build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retry installer build through build pool
        shell: powershell
        run: |
          .\.github\scripts\reaperlink-setup-build.ps1 -Attempt "3-build"
      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ReaperLink-Voice-Tester-Setup
          path: dist/ReaperLink-Voice-Tester-Setup.exe
          if-no-files-found: error
          retention-days: 14

  build_retry_command:
    name: Setup EXE attempt 4 - command verifier
    needs: [build_primary, build_retry_qa, build_retry_build]
    if: ${{ always() }} && needs.build_retry_build.result == 'failure'
    runs-on: [self-hosted, Windows, X64, command, management, verifier]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Final installer retry through Command Squad
        shell: powershell
        run: |
          .\.github\scripts\reaperlink-setup-build.ps1 -Attempt "4-command-verifier"
      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ReaperLink-Voice-Tester-Setup
          path: dist/ReaperLink-Voice-Tester-Setup.exe
          if-no-files-found: error
          retention-days: 14

  watchdog:
    name: ReaperLink build watchdog
    needs: [build_primary, build_retry_qa, build_retry_build, build_retry_command]
    if: ${{ always() }}
    runs-on: [self-hosted, Windows, X64, command, management, watchdog]
    timeout-minutes: 10
    steps:
      - name: Decide final build result
        shell: powershell
        env:
          PRIMARY: ${{ needs.build_primary.result }}
          RETRY_QA: ${{ needs.build_retry_qa.result }}
          RETRY_BUILD: ${{ needs.build_retry_build.result }}
          RETRY_COMMAND: ${{ needs.build_retry_command.result }}
        run: |
          Write-Host "Attempt 1 package: $env:PRIMARY"
          Write-Host "Attempt 2 QA: $env:RETRY_QA"
          Write-Host "Attempt 3 build: $env:RETRY_BUILD"
          Write-Host "Attempt 4 command: $env:RETRY_COMMAND"

          $results = @(
            $env:PRIMARY,
            $env:RETRY_QA,
            $env:RETRY_BUILD,
            $env:RETRY_COMMAND
          )

          if ($results -contains "success") {
            Write-Host "ReaperLink installer build recovered successfully." -ForegroundColor Green
            exit 0
          }

          throw "ReaperLink installer failed all four routed attempts."
