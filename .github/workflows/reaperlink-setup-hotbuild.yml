name: ReaperLink Setup Hot Build

on:
  push:
    branches:
      - reaperlink-voice-dev
    paths:
      - '.github/workflows/reaperlink-setup-hotbuild.yml'
      - 'installer/**'
      - 'apps/**'
      - 'bridge/**'
      - 'client/**'
      - 'compat/**'
      - 'docs/**'
      - 'html/**'
      - 'locales/**'
      - 'server/**'
      - 'sounds/**'
      - 'fxmanifest.lua'
      - 'config.lua'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ReaperLink Setup EXE now
    runs-on: [self-hosted, Windows, X64, testing, qa]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate install engine
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\installer\ReaperLink-InstallCore.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Installer engine syntax validation failed."
          }
          Write-Host "Installer engine syntax OK"

      - name: Find or install Inno Setup
        id: inno
        shell: powershell
        run: |
          function Find-Iscc {
            $paths = @(
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Inno Setup 6\ISCC.exe"
            )

            foreach ($regPath in @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
            )) {
              try {
                $loc = (Get-ItemProperty -LiteralPath $regPath -ErrorAction Stop).InstallLocation
                if ($loc) { $paths += (Join-Path $loc 'ISCC.exe') }
              } catch {}
            }

            return ($paths | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1)
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if (-not $winget) { throw "winget is unavailable and Inno Setup is not installed." }

            & $winget.Source install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements --silent
            if ($LASTEXITCODE -ne 0) { throw "winget failed to install Inno Setup: $LASTEXITCODE" }

            Start-Sleep -Seconds 2
            $iscc = Find-Iscc
          }

          if (-not $iscc) { throw "ISCC.exe could not be located." }

          "iscc=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "ISCC: $iscc"

      - name: Compile setup
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ".\dist" | Out-Null
          & "${{ steps.inno.outputs.iscc }}" ".\installer\ReaperLink-Setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed: $LASTEXITCODE"
          }

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = ".\dist\ReaperLink-Voice-Tester-Setup.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Setup EXE missing." }
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -lt 1000000) { throw "Setup EXE unexpectedly small: $size bytes" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host "EXE: $exe"
          Write-Host "SIZE: $size"
          Write-Host "SHA256: $hash"

      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ReaperLink-Voice-Tester-Setup
          path: dist/ReaperLink-Voice-Tester-Setup.exe
          if-no-files-found: error
          retention-days: 14
