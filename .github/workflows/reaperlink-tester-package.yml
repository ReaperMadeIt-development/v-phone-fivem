name: ReaperLink Tester Package

on:
  workflow_dispatch:
  push:
    branches:
      - reaperlink-voice-dev
    paths:
      - 'installer/**'
      - 'tools/build-reaperlink-tester-package.ps1'
      - 'apps/example/app.lua'
      - 'client/main.lua'
      - 'server/main.lua'
      - 'html/physical.js'
      - 'html/reaperlink-voice.js'
      - 'html/reaperlink-voice-game.js'
      - 'fxmanifest.lua'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'

concurrency:
  group: reaperlink-tester-package
  cancel-in-progress: true

jobs:
  package:
    name: Build tester ZIP
    runs-on: [self-hosted, Windows, X64, org-shared]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        shell: powershell
        run: |
          .\tools\build-reaperlink-tester-package.ps1

      - name: Verify package
        shell: powershell
        run: |
          $zip = ".\dist\ReaperLink-Tester-Package.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Package ZIP missing." }
          $size = (Get-Item -LiteralPath $zip).Length
          if ($size -lt 100000) { throw "Package ZIP is unexpectedly small: $size bytes" }
          Write-Host "Package OK: $size bytes"

      - name: Upload tester package
        uses: actions/upload-artifact@v4
        with:
          name: ReaperLink-Tester-Package
          path: dist/ReaperLink-Tester-Package.zip
          if-no-files-found: error
          retention-days: 14
